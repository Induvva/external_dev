<!DOCTYPE html>
<html>

        <title>Register</title>
    </head>
    <body><center><h1>Register</h1>
        <form method="POST" action="/register">
            <label for="username">Username:</label>

            <input type="submit" value="Register">
        </form>
    </center>
    </body>
</html>
